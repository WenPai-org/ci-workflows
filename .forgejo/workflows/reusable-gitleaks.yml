# 可复用密钥与敏感信息扫描工作流（FeiCode Software Factory v2）
# 调用示例：
#   jobs:
#     secrets-scan:
#       uses: https://feicode.com/WenPai-org/ci-workflows/.forgejo/workflows/reusable-gitleaks.yml@main
name: Reusable Gitleaks Scan

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner 标签（默认 ubuntu-latest）"
        required: false
        type: string
        default: "ubuntu-latest"
      fetch_depth:
        description: "Git 检出深度（0 表示完整历史；大仓可设为 50）"
        required: false
        type: number
        default: 0
      config_path:
        description: "可选：仓库内自定义 .gitleaks.toml 路径"
        required: false
        type: string
        default: ""
      scan_mode:
        description: "扫描模式：auto（push 扫增量、PR 扫工作区）、working-tree（仅当前代码树）、full（完整提交历史）"
        required: false
        type: string
        default: "auto"
      fail_on_missing_gitleaks:
        description: "当 Runner 镜像内未预装 gitleaks 二进制时是否直接失败（默认 false，自动降级为内置正则红线扫描）"
        required: false
        type: boolean
        default: false

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Run secret scan (gitleaks with built-in fallback)
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          SCAN_MODE: ${{ inputs.scan_mode }}
          FAIL_ON_MISSING: ${{ inputs.fail_on_missing_gitleaks }}
        run: |
          set -euo pipefail

          if command -v gitleaks >/dev/null 2>&1; then
            echo ">>> Using gitleaks: $(gitleaks version 2>&1 || true)"
            ARGS=(detect --source=. --redact --no-banner --exit-code 1)
            if [ -n "${CONFIG_PATH}" ] && [ -f "${CONFIG_PATH}" ]; then
              ARGS+=(--config "${CONFIG_PATH}")
            elif [ -f ".gitleaks.toml" ]; then
              ARGS+=(--config ".gitleaks.toml")
            fi

            case "${SCAN_MODE}" in
              working-tree)
                ARGS+=(--no-git)
                ;;
              full)
                ;;
              auto|*)
                if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ -n "${GITHUB_SHA:-}" ] && git rev-parse --verify "${GITHUB_SHA}~1" >/dev/null 2>&1; then
                  ARGS+=(--log-opts "${GITHUB_SHA}~1..${GITHUB_SHA}")
                else
                  ARGS+=(--no-git)
                fi
                ;;
            esac

            if ! gitleaks "${ARGS[@]}"; then
              echo "::error::gitleaks 发现潜在密钥泄露，请检查上方脱敏报告并轮换对应凭据。"
              exit 1
            fi
            echo ">>> gitleaks 扫描通过，未发现密钥泄露。"
            exit 0
          fi

          if [ "${FAIL_ON_MISSING}" = "true" ]; then
            echo "::error::Runner 镜像未安装 gitleaks 且 fail_on_missing_gitleaks=true"
            exit 1
          fi

          echo "::warning::gitleaks binary not found in runner image; falling back to built-in regex secret scanner."

          python3 - <<'PYEOF'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          # 高置信度密钥/私钥特征（严格避免打印命中的明文密钥值）
          PATTERNS = [
              ("private_key", re.compile(r"-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----")),
              ("aws_access_key", re.compile(r"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b")),
              ("github_pat", re.compile(r"\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b")),
              ("github_fine_grained", re.compile(r"\bgithub_pat_[A-Za-z0-9_]{40,}\b")),
              ("gitlab_pat", re.compile(r"\bglpat-[A-Za-z0-9_-]{20,}\b")),
              ("slack_token", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{10,48}\b")),
              ("stripe_live_key", re.compile(r"\b(?:sk|rk)_live_[0-9A-Za-z]{20,}\b")),
              ("openai_key", re.compile(r"\bsk-(?:proj-)?[A-Za-z0-9_-]{32,}\b")),
              ("anthropic_key", re.compile(r"\bsk-ant-api03-[A-Za-z0-9_-]{40,}\b")),
              ("aliyun_access_key", re.compile(r"\bLTAI[A-Za-z0-9]{16,24}\b")),
              ("google_api_key", re.compile(r"\bAIza[0-9A-Za-z_-]{35}\b")),
          ]

          SKIP_PREFIXES = (".git/", "vendor/", "node_modules/")
          SKIP_EXTS = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".svg",
              ".woff", ".woff2", ".ttf", ".eot", ".otf",
              ".zip", ".tar", ".gz", ".bz2", ".xz", ".7z", ".pdf", ".wasm",
              ".mo", ".pyc", ".so", ".dylib", ".dll", ".exe",
          }

          ignore_paths = set()
          ignore_file = Path(".gitleaksignore")
          if ignore_file.is_file():
              for line in ignore_file.read_text(encoding="utf-8", errors="ignore").splitlines():
                  line = line.strip()
                  if line and not line.startswith("#"):
                      ignore_paths.add(line.split(":", 1)[0].strip())

          try:
              raw = subprocess.check_output(["git", "ls-files", "-z"], stderr=subprocess.DEVNULL)
              files = [p.decode("utf-8", errors="ignore") for p in raw.split(b"\0") if p]
          except Exception:
              files = [str(p) for p in Path(".").rglob("*") if p.is_file()]

          hits = []
          scanned = 0
          for rel in files:
              rel = rel.lstrip("./")
              if not rel or rel.startswith(SKIP_PREFIXES) or rel in ignore_paths:
                  continue
              p = Path(rel)
              if not p.is_file() or p.suffix.lower() in SKIP_EXTS:
                  continue
              if p.stat().st_size > 2 * 1024 * 1024:
                  continue
              try:
                  data = p.read_bytes()
              except OSError:
                  continue
              if b"\x00" in data[:4096]:
                  continue
              scanned += 1
              text = data.decode("utf-8", errors="ignore")
              for lineno, line in enumerate(text.splitlines(), 1):
                  if "gitleaks:allow" in line or "pragma: allowlist secret" in line:
                      continue
                  for rule_id, regex in PATTERNS:
                      if regex.search(line):
                          hits.append((rel, lineno, rule_id))

          print(f">>> Fallback secret scan checked {scanned} text file(s).")
          if hits:
              for rel, lineno, rule_id in hits[:50]:
                  print(f"::error file={rel},line={lineno}::Matched secret rule '{rule_id}' (value redacted)")
              print(f"::error::Fallback secret scan found {len(hits)} potential secret(s).", file=sys.stderr)
              sys.exit(1)

          print(">>> Fallback secret scan passed (0 matches).")
          PYEOF
