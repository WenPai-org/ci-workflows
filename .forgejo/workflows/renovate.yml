name: Renovate 依赖更新

on:
  schedule:
    - cron: '0 4 * * 1,4'  # 每周一、四凌晨 4 点
  workflow_dispatch:

jobs:
  renovate:
    runs-on: docker
    container:
      image: renovate/renovate:latest
    steps:
      - name: Run Renovate
        env:
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: ${{ secrets.FORGEJO_URL }}/api/v1
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@feicode.com>"
          LOG_LEVEL: info
        run: |
          renovate --autodiscover=true --autodiscover-filter="WenPai-org/*"
