name: Renovate 依赖更新

on:
  schedule:
    - cron: '0 3 * * 1'  # 每周一凌晨 3 点
  workflow_dispatch:

jobs:
  renovate:
    runs-on: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Renovate
        env:
          RENOVATE_CONFIG_FILE: renovate-global.json
          RENOVATE_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@feicode.com>"
          LOG_LEVEL: info
        run: npx --yes renovate
