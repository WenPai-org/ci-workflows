name: Stale Issue/PR 清理

on:
  schedule:
    - cron: '0 5 * * 1'  # 每周一凌晨 5 点
  workflow_dispatch:

jobs:
  stale-cleanup:
    runs-on: linux-arm64
    steps:
      - name: 清理所有原创仓库的过期 Issue 和 PR
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          API_BASE="https://feicode.com/api/v1"
          NOW=$(date +%s)

          # 受保护标签
          PROTECTED_LABELS="pinned|help-wanted|bug|security|wontfix"

          # 阈值
          ISSUE_STALE_DAYS=60
          ISSUE_CLOSE_DAYS=74
          PR_STALE_DAYS=30
          PR_CLOSE_DAYS=44

          # 获取所有原创仓库
          REPOS=$(curl -s -H "Authorization: token $FORGEJO_TOKEN" \
            "$API_BASE/repos/search?limit=50&sort=updated&order=desc" | \
            python3 -c "
          import json, sys
          repos = json.load(sys.stdin).get('data', [])
          for r in repos:
              if not r.get('mirror') and not r.get('fork') and not r.get('archived'):
                  print(r['full_name'])
          ")

          ensure_stale_label() {
            local FULL_NAME=$1
            # 检查 stale 标签是否存在，不存在则创建
            local LABEL_ID=$(curl -s -H "Authorization: token $FORGEJO_TOKEN" \
              "$API_BASE/repos/$FULL_NAME/labels?limit=50" | \
              python3 -c "
          import json, sys
          labels = json.load(sys.stdin)
          for l in labels:
              if l['name'] == 'stale':
                  print(l['id'])
                  break
          " 2>/dev/null)

            if [ -z "$LABEL_ID" ]; then
              LABEL_ID=$(curl -s -X POST -H "Authorization: token $FORGEJO_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"name":"stale","color":"#ededed","description":"长期无活动"}' \
                "$API_BASE/repos/$FULL_NAME/labels" | \
                python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
              [ -n "$LABEL_ID" ] && echo "  创建 stale 标签: ID=$LABEL_ID"
            fi
            echo "$LABEL_ID"
          }

          process_repo() {
            local FULL_NAME=$1
            local STALE_LABEL_ID=$(ensure_stale_label "$FULL_NAME")

            for TYPE in issues pulls; do
              if [ "$TYPE" = "issues" ]; then
                STALE_SECS=$((ISSUE_STALE_DAYS * 86400))
                CLOSE_SECS=$((ISSUE_CLOSE_DAYS * 86400))
                STALE_DAYS=$ISSUE_STALE_DAYS
              else
                STALE_SECS=$((PR_STALE_DAYS * 86400))
                CLOSE_SECS=$((PR_CLOSE_DAYS * 86400))
                STALE_DAYS=$PR_STALE_DAYS
              fi

              PAGE=1
              while true; do
                ITEMS=$(curl -s -H "Authorization: token $FORGEJO_TOKEN" \
                  "$API_BASE/repos/$FULL_NAME/issues?state=open&type=$TYPE&page=$PAGE&limit=50")

                ACTIONS=$(echo "$ITEMS" | python3 -c "
          import json, sys
          from datetime import datetime, timezone

          items = json.load(sys.stdin)
          if not items:
              sys.exit(0)

          now = $NOW
          protected = set('$PROTECTED_LABELS'.split('|'))

          for item in items:
              labels = [l['name'] for l in item.get('labels', [])]
              if protected & set(labels):
                  continue
              dt = datetime.fromisoformat(item['updated_at'].replace('Z', '+00:00'))
              age = now - int(dt.timestamp())
              if age > $CLOSE_SECS:
                  print(f'CLOSE|{item[\"number\"]}|{item[\"title\"][:60]}')
              elif age > $STALE_SECS and 'stale' not in labels:
                  print(f'STALE|{item[\"number\"]}|{item[\"title\"][:60]}')
          " 2>/dev/null)

                [ -z "$ACTIONS" ] && break

                echo "$ACTIONS" | while IFS='|' read -r ACTION NUMBER TITLE; do
                  [ -z "$ACTION" ] && continue
                  if [ "$ACTION" = "STALE" ] && [ -n "$STALE_LABEL_ID" ]; then
                    echo "  标记 $FULL_NAME#$NUMBER 为 stale: $TITLE"
                    curl -s -X POST -H "Authorization: token $FORGEJO_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "{\"labels\":[$STALE_LABEL_ID]}" \
                      "$API_BASE/repos/$FULL_NAME/issues/$NUMBER/labels" > /dev/null
                    curl -s -X POST -H "Authorization: token $FORGEJO_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "{\"body\":\"此 ${TYPE%s} 已超过 ${STALE_DAYS} 天无活动，已标记为 stale。如果 14 天内无新活动将自动关闭。\"}" \
                      "$API_BASE/repos/$FULL_NAME/issues/$NUMBER/comments" > /dev/null
                  elif [ "$ACTION" = "CLOSE" ]; then
                    echo "  关闭 $FULL_NAME#$NUMBER: $TITLE"
                    curl -s -X PATCH -H "Authorization: token $FORGEJO_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d '{"state":"closed"}' \
                      "$API_BASE/repos/$FULL_NAME/issues/$NUMBER" > /dev/null
                    curl -s -X POST -H "Authorization: token $FORGEJO_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "{\"body\":\"此 ${TYPE%s} 因长期无活动已自动关闭。如需继续讨论请重新打开。\"}" \
                      "$API_BASE/repos/$FULL_NAME/issues/$NUMBER/comments" > /dev/null
                  fi
                done

                PAGE=$((PAGE + 1))
                # 如果返回不足 50 条说明是最后一页
                ITEM_COUNT=$(echo "$ITEMS" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null)
                [ "$ITEM_COUNT" -lt 50 ] 2>/dev/null && break
              done
            done
          }

          echo "=== Stale 清理开始 ==="
          for REPO in $REPOS; do
            echo "处理 $REPO ..."
            process_repo "$REPO"
          done
          echo "=== 清理完成 ==="
